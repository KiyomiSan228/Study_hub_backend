services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: studyhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "timezone=Europe/Moscow"]
    ports:
      - "5433:5432"
    volumes:
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studyhub"]
      interval: 5s
      retries: 10

volumes:
  db_data:
